{% csrf_token %}
{% if form.non_field_errors %}
<p class="checkout__error" role="alert">
    {% for error in form.non_field_errors %}{{ error }}{% endfor %}
</p>
{% endif %}

{% for field in form %}
<div class="form-field">
    {{ field.label_tag }}
    {{ field }}
    {% if field.help_text %}
    <p class="form-field__help">{{ field.help_text|safe }}</p>
    {% endif %}
    {{ field.errors }}
</div>
{% endfor %}
